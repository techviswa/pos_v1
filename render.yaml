services:
  - type: web
    name: cashflow-lite-pos-backend
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm ci && npm run prisma:generate
    preDeployCommand: npm run prisma:deploy && npm run prisma:seed
    startCommand: npm start
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: CashFlow Lite POS
      - key: PORT
        value: 10000
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_URL
        sync: false
      - key: SYSTEM_DATABASE_URL
        sync: false
      - key: TENANT_DATABASE_URL
        sync: false
      - key: DEFAULT_TENANT_ID
        value: demo-tenant
      - key: DEFAULT_BUSINESS_ID
        value: demo-business
      # The first Owner's login. Set a real address: the public default is flagged at start-up.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FEEDBACK_TOKEN_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      # Encrypts each business's WhatsApp/SMS and Razorpay credentials (used when SECRETS_ENCRYPTION_KEY is
      # not set). Never change it once accounts are connected: stored credentials would have to be entered again.
      - key: MARKETING_ENCRYPTION_KEY
        generateValue: true
      # Sentry error alerts. Leave empty to turn reporting off. Personal data is scrubbed before sending.
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      # Public https URL of this API, used in WhatsApp/SMS and Razorpay webhook addresses shown in the app.
      - key: POS_PUBLIC_API_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: POS_BASE_URL
        sync: false
      - key: QR_PUBLIC_BASE_URL
        sync: false
      - key: ADMINCORE_ENABLED
        value: false
      # Nightly encrypted off-site backup (S3-compatible: Cloudflare R2, Backblaze B2 or AWS S3). Until the bucket and
      # key are set, Settings shows "Not set up yet". BACKUP_ENCRYPTION_KEY: your own random 32+ character secret;
      # keep a copy in a password manager - without it no backup can be restored.
      - key: BACKUP_S3_ENDPOINT
        sync: false
      - key: BACKUP_S3_REGION
        value: auto
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_ACCESS_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET_ACCESS_KEY
        sync: false
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: BACKUP_HOUR
        value: "3"
      - key: BACKUP_TIMEZONE
        value: Asia/Kolkata
      - key: ADMINCORE_API_BASE_URL
        sync: false
      - key: ADMINCORE_API_KEY
        sync: false
      - key: ADMINCORE_SYNC_WEBHOOK_URL
        sync: false
