services:
  - type: web
    name: cashflow-lite-pos-backend
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm ci && npm run prisma:generate
    preDeployCommand: npm run prisma:deploy && npm run prisma:seed
    startCommand: npm start
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: CashFlow Lite POS
      - key: PORT
        value: 10000
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_URL
        sync: false
      - key: DEFAULT_TENANT_ID
        value: demo-tenant
      - key: DEFAULT_BUSINESS_ID
        value: demo-business
      # The first Owner's login. Set a real address: the public default is flagged at start-up.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FEEDBACK_TOKEN_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      # Encrypts each business's WhatsApp/SMS credentials. Never change it once accounts are connected
      # (stored credentials would have to be entered again).
      - key: MARKETING_ENCRYPTION_KEY
        generateValue: true
      # Public https URL of this API, used in WhatsApp/SMS webhook addresses shown on the Marketing screen.
      - key: POS_PUBLIC_API_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: POS_BASE_URL
        sync: false
      - key: QR_PUBLIC_BASE_URL
        sync: false
      - key: ADMINCORE_ENABLED
        value: false
      - key: ADMINCORE_API_BASE_URL
        sync: false
      - key: ADMINCORE_API_KEY
        sync: false
      - key: ADMINCORE_SYNC_WEBHOOK_URL
        sync: false
