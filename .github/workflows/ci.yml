name: POS CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pos_ci
          POSTGRES_PASSWORD: pos_ci_password
          POSTGRES_DB: pos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pos_ci -d pos_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://pos_ci:pos_ci_password@localhost:5432/pos_ci?schema=public
      JWT_SECRET: github-actions-test-secret
      SESSION_SECRET: github-actions-session-secret
      ADMINCORE_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Validate Prisma schema
        run: npm --prefix backend run prisma:validate

      - name: Generate Prisma client
        run: npm --prefix backend run prisma:generate

      - name: Apply database migrations
        run: npm --prefix backend run prisma:deploy

      - name: Seed database
        run: npm --prefix backend run prisma:seed

      - name: Backend syntax check
        run: npm --prefix backend run check

      - name: Backend smoke tests
        run: npm --prefix backend run test:smoke

      - name: Deployment safety check
        run: npm --prefix backend run deploy:check

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    env:
      CI: "false"
      GENERATE_SOURCEMAP: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build frontend
        run: npm --prefix frontend run build
